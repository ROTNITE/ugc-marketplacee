services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      ACCESS_TOKEN_TTL_SECONDS: 900
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://ugc:ugc@postgres:5432/ugc_marketplace
      EMAIL_VERIFICATION_TTL_HOURS: 24
      JWT_SECRET: replace-with-local-development-secret
      NODE_ENV: development
      REFRESH_TOKEN_TTL_DAYS: 30
      REDIS_URL: redis://redis:6379
      WEB_APP_URL: http://localhost:${WEB_PORT:-3000}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
      NODE_ENV: development
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ugc_marketplace
      POSTGRES_PASSWORD: ugc
      POSTGRES_USER: ugc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugc -d ugc_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres-data:
